name: build-release

on:
  release:
    types: [published]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.release.tag_name }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  # vcpkg 固定提交：5 个平台共用同一份端口定义
  VCPKG_COMMIT: 3aea538b2bb21a586502c67b00eb474fdd2e3098
  # 依赖清单（vcpkg.json）或 triplet 变更时把这个数字 +1，使依赖缓存失效；
  # 与工作流其它改动无关，避免每次改工作流都重新编译依赖
  VCPKG_DEPS_REV: "1"

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    # 首次构建依赖（OpenSSL/curl 等）耗时较长，留足时间但避免异常时挂满 6 小时
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x86_64
            os: windows-2025
            triplet: x64-windows-static
            artifact: luogu-extract-windows-x86_64
          - name: macOS x86_64
            os: macos-15-intel
            triplet: x64-osx-static
            artifact: luogu-extract-macos-x86_64
          - name: macOS arm64
            os: macos-15
            triplet: arm64-osx-static
            artifact: luogu-extract-macos-arm64
          # Linux 不再使用 -static（LUOGU_EXTRACT_FULLY_STATIC）：完全静态链接 glibc 后，
          # 一旦运行期 dlopen 了宿主机的共享库（glibc 的 NSS 模块一定会走这条路，例如
          # nss-mdns4/nss-resolve，libcurl 解析域名时就会加载），进程里就会同时存在两份
          # libc，宿主机 libc.so.6 的 _rtld_global_ro 与静态链接进去的那份布局/版本不一致，
          # roundup(__static_tls_size, GLRO(dl_tls_static_align)) 除数为 0 → SIGFPE 崩溃。
          # 第三方库仍全部静态链接（LUOGU_EXTRACT_STATIC），只让 glibc 动态。
          - name: Linux x86_64
            os: ubuntu-24.04
            triplet: x64-linux-static
            artifact: luogu-extract-linux-x86_64
          - name: Linux arm64
            os: ubuntu-24.04-arm
            triplet: arm64-linux-static
            artifact: luogu-extract-linux-arm64

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: 安装 vcpkg（Linux / macOS）
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/vcpkg"
          if [ ! -x "$root/vcpkg" ]; then
            rm -rf "$root"
            git init -q "$root"
            git -C "$root" remote add origin https://github.com/microsoft/vcpkg
            git -C "$root" fetch -q --depth 1 origin "$VCPKG_COMMIT"
            git -C "$root" checkout -q FETCH_HEAD
            "$root/bootstrap-vcpkg.sh" -disableMetrics
          fi
          echo "VCPKG_ROOT=$root" >> "$GITHUB_ENV"

      - name: 安装 vcpkg（Windows）
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          # 故意不用镜像预装的 C:\vcpkg：那是非 git 检出（vcpkg 会因此要求 manifest
          # 里写 builtin-baseline），这里固定克隆我们指定的提交，保证与其他平台一致
          $root = 'C:/vcpkg-ci'
          if (-not (Test-Path "$root/.git")) {
            Remove-Item -Recurse -Force $root -ErrorAction SilentlyContinue
            git init -q $root
            git -C $root remote add origin https://github.com/microsoft/vcpkg
            git -C $root fetch -q --depth 1 origin $env:VCPKG_COMMIT
            git -C $root checkout -q FETCH_HEAD
            & "$root/bootstrap-vcpkg.bat" -disableMetrics
          }
          "VCPKG_ROOT=$root" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: 生成 vcpkg 清单与 triplet
        shell: bash
        run: |
          set -euo pipefail
          project_dir="$PWD"
          if [ "$RUNNER_OS" = "Windows" ]; then
            project_dir=$(cygpath -m "$PWD")
          fi
          echo "PROJECT_DIR=$project_dir" >> "$GITHUB_ENV"

          # 版本号以 CMakeLists.txt 的 project(... VERSION x.y.z) 为唯一来源，避免多处不一致
          version=$(sed -nE 's/^[[:space:]]*project\([^)]*VERSION[[:space:]]+([0-9]+(\.[0-9]+)*).*/\1/p' CMakeLists.txt | head -1)
          if [ -z "$version" ]; then
            echo "::error::无法从 CMakeLists.txt 解析 project(... VERSION ...)"
            exit 1
          fi
          echo "项目版本：$version"

          if [ ! -f "$project_dir/vcpkg.json" ]; then
            printf '%s\n' \
              '{' \
              '  "name": "luogu-extract",' \
              "  \"version-string\": \"$version\"," \
              '  "dependencies": [' \
              '    { "name": "curl", "default-features": false, "features": ["ssl"] },' \
              '    "libxml2",' \
              '    "zlib",' \
              '    "nlohmann-json"' \
              '  ]' \
              '}' > "$project_dir/vcpkg.json"
          fi
          cat "$project_dir/vcpkg.json"

          triplet="${{ matrix.triplet }}"
          arch=""; crt="dynamic"; system=""; osx_arch=""
          case "$triplet" in
            x64-windows-static) arch=x64;   crt=static ;;
            x64-linux-static)   arch=x64;   system=Linux ;;
            arm64-linux-static) arch=arm64; system=Linux ;;
            x64-osx-static)     arch=x64;   system=Darwin; osx_arch=x86_64 ;;
            arm64-osx-static)   arch=arm64; system=Darwin; osx_arch=arm64 ;;
            *) echo "未知 triplet：$triplet" >&2; exit 1 ;;
          esac
          mkdir -p "$project_dir/.ci-triplets"
          {
            echo "set(VCPKG_TARGET_ARCHITECTURE $arch)"
            echo "set(VCPKG_CRT_LINKAGE $crt)"
            echo "set(VCPKG_LIBRARY_LINKAGE static)"
            echo "set(VCPKG_BUILD_TYPE release)"
            if [ -n "$system" ]; then
              echo "set(VCPKG_CMAKE_SYSTEM_NAME $system)"
            fi
            if [ -n "$osx_arch" ]; then
              echo "set(VCPKG_OSX_ARCHITECTURES $osx_arch)"
              # 与 CMAKE_OSX_DEPLOYMENT_TARGET 保持一致，避免依赖与主程序目标版本不同
              echo "set(VCPKG_OSX_DEPLOYMENT_TARGET 11.0)"
            fi
          } > "$project_dir/.ci-triplets/$triplet.cmake"
          cat "$project_dir/.ci-triplets/$triplet.cmake"

      - name: 缓存 vcpkg 依赖
        uses: actions/cache@v6
        with:
          path: vcpkg_installed
          key: vcpkg-${{ runner.os }}-${{ matrix.triplet }}-${{ env.VCPKG_COMMIT }}-${{ env.VCPKG_DEPS_REV }}
          restore-keys: |
            vcpkg-${{ runner.os }}-${{ matrix.triplet }}-${{ env.VCPKG_COMMIT }}-

      - name: 安装依赖（vcpkg 静态 triplet）
        shell: bash
        run: |
          set -euo pipefail
          exe="vcpkg"
          if [ "$RUNNER_OS" = "Windows" ]; then exe="vcpkg.exe"; fi
          # manifest 模式：在清单所在目录执行，--x-install-root 固定安装位置便于缓存
          cd "$PROJECT_DIR"
          "$VCPKG_ROOT/$exe" install \
            --triplet "${{ matrix.triplet }}" \
            --overlay-triplets="$PROJECT_DIR/.ci-triplets" \
            --x-install-root="$PROJECT_DIR/vcpkg_installed" \
            --clean-after-build

      # Windows 用 Visual Studio 生成器（不需要 vcvars，也不改动 PATH）：
      # 生成器名随 VS 版本变化（17→2022、18→2026），且新生成器要求较新的 CMake，
      # 因此取「本机 CMake 支持的 VS 生成器」与「本机已安装的 VS」的交集中版本最高者；
      # 取不到就不传 -G，交由 CMake 选择默认生成器（Windows 上同样是 VS 生成器）。
      - name: 选择 Visual Studio 生成器（Windows）
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          cmake --version | Select-Object -First 1
          $supported = [regex]::Matches(((cmake --help) -join "`n"), 'Visual Studio (\d+) (\d{4})') |
            ForEach-Object { [pscustomobject]@{ Major = [int]$_.Groups[1].Value; Name = $_.Value } } |
            Sort-Object Major -Descending
          Write-Host "本机 CMake 支持的 VS 生成器: $($supported.Name -join ', ')"
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $installed = @(& $vswhere -all -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationVersion |
            ForEach-Object { [int]($_.Split('.')[0]) })
          if ($installed.Count -eq 0) { throw '找不到带 C++ 工具链的 Visual Studio' }
          Write-Host "已安装的 VS 主版本: $($installed -join ', ')"
          $pick = $supported | Where-Object { $installed -contains $_.Major } | Select-Object -First 1
          if (-not $pick) {
            Write-Host '::warning::没有 CMake 支持且本机已安装的 VS 生成器，改用 CMake 默认生成器'
            exit 0
          }
          Write-Host "使用生成器: $($pick.Name)"
          Add-Content -Path $env:GITHUB_ENV -Value "LUOGU_CMAKE_GENERATOR=$($pick.Name)" -Encoding utf8

      - name: 配置 CMake
        shell: bash
        run: |
          set -euo pipefail
          args=(-S "$PROJECT_DIR" -B "$PROJECT_DIR/build")
          if [ "$RUNNER_OS" = "Windows" ]; then
            # 探测不到生成器时用 CMake 默认（Windows 上默认同样是 VS 生成器，平台为 x64）
            if [ -n "${LUOGU_CMAKE_GENERATOR:-}" ]; then
              args+=(-G "$LUOGU_CMAKE_GENERATOR" -A x64)
            fi
          else
            args+=(-G Ninja)
          fi
          args+=(
            -DCMAKE_BUILD_TYPE=Release
            -DCMAKE_TOOLCHAIN_FILE="$VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake"
            -DVCPKG_TARGET_TRIPLET="${{ matrix.triplet }}"
            # 工具链在 configure 阶段也会解析/校验依赖，必须同样能看到自定义 triplet
            -DVCPKG_OVERLAY_TRIPLETS="$PROJECT_DIR/.ci-triplets"
            -DVCPKG_INSTALLED_DIR="$PROJECT_DIR/vcpkg_installed"
            -DVCPKG_MANIFEST_MODE=ON
            -DLUOGU_EXTRACT_STATIC=ON
            -DLUOGU_EXTRACT_FULLY_STATIC=${{ matrix.fully_static || 'OFF' }}
          )
          if [ "$RUNNER_OS" = "macOS" ]; then
            args+=(-DCMAKE_OSX_DEPLOYMENT_TARGET=11.0)
          fi
          cmake "${args[@]}"

      - name: 编译
        shell: bash
        run: cmake --build "$PROJECT_DIR/build" --config Release --parallel

      - name: 收集产物
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$PROJECT_DIR/dist" "$PROJECT_DIR/package"
          cmake --install "$PROJECT_DIR/build" --config Release --prefix "$PROJECT_DIR/dist"
          if [ "$RUNNER_OS" = "Linux" ]; then
            strip "$PROJECT_DIR/dist/bin/luogu-extract"
          fi
          # 打包目录保持扁平（可执行文件与 LICENSE 直接位于根），
          # 避免上传/解压后多出 dist/bin/ 一层目录
          mkdir -p "$PROJECT_DIR/package"
          cp "$PROJECT_DIR/dist/bin/"* "$PROJECT_DIR/package/"
          cp "$PROJECT_DIR/LICENSE" "$PROJECT_DIR/package/"
          ls -l "$PROJECT_DIR/package"

      - name: 校验静态链接（Linux / macOS）
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          bin="$PROJECT_DIR/package/luogu-extract"
          echo "== 产物 =="
          ls -l "$bin"
          if [ "$RUNNER_OS" = "Linux" ]; then
            file "$bin"
            # glibc 必须动态链接（见 matrix 中 Linux 不设 fully_static 的说明）：完全静态链接
            # 的 glibc 与运行期 dlopen 进来的宿主机 NSS 模块（nss-mdns4/nss-resolve 等）会形成
            # 两份 libc，域名解析时除数为 0 直接 SIGFPE。除 glibc 家族与动态加载器之外，不允许
            # 出现其它动态库：libcurl/libxml2/openssl/zlib/libstdc++ 都必须已静态链接进产物
            ldd "$bin" || true
            if ldd "$bin" 2>/dev/null | grep -Ev '^[[:space:]]*(linux-vdso\.so[^[:space:]]*|libc\.so\.6|libm\.so\.6|libpthread\.so\.0|libdl\.so\.2|[^[:space:]]*ld-linux[^[:space:]]*)[[:space:]]' | grep -q .; then
              echo "::error::产物依赖了 glibc 之外的动态库（第三方库应静态链接）"
              exit 1
            fi
            echo "ldd：只依赖 glibc（含动态加载器），第三方库均已静态链接"
            # 反向保护：完全静态的产物在带 nss-mdns4 / nss-resolve 等第三方 NSS 模块的发行版上
            # 解析域名时会 SIGFPE（进程内两份 libc），必须确保 glibc 是动态链接的
            if ! ldd "$bin" 2>/dev/null | grep -qE '^[[:space:]]*libc\.so\.6[[:space:]]'; then
              echo "::error::产物没有动态链接 glibc：完全静态产物 + NSS 模块会在解析域名时 SIGFPE"
              exit 1
            fi
            # 运行环境 glibc 下限：写进 Release 说明，便于用户判断能否直接运行
            glibc_floor=$(objdump -T "$bin" 2>/dev/null | grep -oE 'GLIBC_[0-9]+\.[0-9]+' | sort -uV | tail -1 || true)
            echo "glibc 版本下限：${glibc_floor:-未知}"
          else
            otool -L "$bin"
            # BSD grep 不支持 \s，这里用 POSIX 字符类；只允许 /usr/lib 与 /System/Library
            if otool -L "$bin" | tail -n +2 | grep -Ev '^[[:space:]]*(/usr/lib/|/System/Library/)'; then
              echo "::error::产物依赖了非系统动态库"
              exit 1
            fi
            echo "otool：只依赖系统库"
          fi
          # 构建机路径残留：静态链接 OpenSSL / libxml2 时，各自的构建脚本会把 modules/engines
          # 目录、XML catalog 路径写死成 vcpkg 的构建目录，用户机器上并不存在。它们不影响默认
          # 功能（default provider 内建在 libcrypto 里、CA 包由程序运行期重新探测、HTML 解析不用
          # catalog），也无法从本项目侧消除，故只写日志、不发 GitHub 告警注解，避免每次发版刷屏。
          # 注意：不要用 OPENSSL_MODULES/OPENSSL_ENGINES 指向系统目录来「修」它——那会让静态链接的
          # OpenSSL 加载宿主机上按另一份 libcrypto 编译的 provider，等同把共享库塞进静态进程。
          leaked=$(strings -a "$bin" | grep -E '/(home|Users)/[^[:space:]]*(runner|vcpkg)' \
                     | grep -vE '\.(c|h|cpp|hpp|cc|md|txt|pl|sh|S)$' \
                     | grep -vE '/(buildtrees|packages)/' | sort -u || true)
          if [ -n "${leaked:-}" ]; then
            echo "提示：产物含 $(printf '%s\n' "$leaked" | wc -l) 处构建机路径（不影响默认 TLS / HTML 解析）："
            printf '%s\n' "$leaked" | sed 's/^/  /'
          fi
          echo "== 冒烟测试 =="
          "$bin" --version

      - name: 校验静态链接（Windows）
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $bin = Get-ChildItem -Path "$env:PROJECT_DIR/package" -Recurse -Filter 'luogu-extract.exe' | Select-Object -First 1
          if (-not $bin) { throw '找不到 luogu-extract.exe' }
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vsPath = & $vswhere -latest -property installationPath
          $dumpbin = Get-ChildItem "$vsPath\VC\Tools\MSVC\*\bin\Hostx64\x64\dumpbin.exe" | Select-Object -First 1
          if (-not $dumpbin) { throw '找不到 dumpbin.exe' }
          $deps = & $dumpbin.FullName /dependents $bin.FullName | Out-String
          Write-Host $deps
          if ($deps -match '(?i)(libcurl|libxml2|zlib1?|libssl|libcrypto|iconv)\.dll') {
            throw '产物仍依赖第三方 DLL，静态链接失败'
          }
          Write-Host '== 冒烟测试 =='
          & $bin.FullName --version
          if ($LASTEXITCODE -ne 0) { throw "冒烟测试失败：退出码 $LASTEXITCODE" }

      - name: 上传产物
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: package
          if-no-files-found: error

  release:
    name: 上传产物到 Release
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: 打包
        shell: bash
        run: |
          set -euo pipefail
          tag="${{ github.event.release.tag_name }}"
          assets="$PWD/release-assets"
          mkdir -p "$assets"
          cd artifacts
          for dir in */; do
            name="${dir%/}"
            platform="${name#luogu-extract-}"
            case "$platform" in
              windows-*)
                # Windows 习惯用 zip；解压后根目录即 exe 与 LICENSE
                (cd "$name" && zip -q -r "$assets/luogu-extract-${tag}-${platform}.zip" .)
                ;;
              *)
                # zip 在多数解压工具里会丢掉可执行权限，Unix 平台改用 tar.gz
                chmod +x "$name/luogu-extract"
                tar -czf "$assets/luogu-extract-${tag}-${platform}.tar.gz" \
                  -C "$name" luogu-extract LICENSE
                ;;
            esac
          done
          ls -l "$assets"

      - name: 上传到 Release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh release upload "${{ github.event.release.tag_name }}" release-assets/* \
            --repo "$GITHUB_REPOSITORY" --clobber
